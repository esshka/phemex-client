# config.example.yml
# Phemex NATS Order Listener - Configuration
# Copy this file to config.yml and fill in your values

# Phemex API credentials
phemex:
  api_key: "your_api_key_here"
  secret: "your_api_secret_here"
  testnet: false

# NATS settings
nats:
  url: "nats://localhost:4222"
  subject: "orders"

# Position sizing
position_sizing:
  deposit_size: 1000.0    # Total deposit in USDT
  r_percentage: 0.01      # Risk per R unit (1% = 0.01)

# Trading settings
trading:
  symbols:
    - "SOL/USDT:USDT"
  leverage: 20

# Execution settings
execution:
  use_chase_orders: false   # If true, use limit chase. If false, use market orders.
  chase_mode: "bid2"        # bid1, bid2, ask1, ask2, distance
  max_chase_retries: 50     # Max number of price updates before giving up
